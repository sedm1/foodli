name: 🚀 Deploy to VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Upload project to VPS via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete --exclude='.git' --exclude='.github' --exclude='.env' --exclude='node_modules' --exclude='**/.output' --exclude='**/target'
          path: ./
          remote_path: /opt/app/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_KEY }}

      - name: 🐳 Build & Restart with BuildKit cache
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/app

            echo "🔧 Preparing local build cache and builder..."
            mkdir -p /opt/.buildx-cache/backend /opt/.buildx-cache/frontend
            chown -R $(id -u):$(id -g) /opt/.buildx-cache || true

            export DOCKER_BUILDKIT=1

            # создать билдера, если ещё не создан
            if ! docker buildx inspect vpsbuilder >/dev/null 2>&1; then
              docker buildx create --use --name vpsbuilder
            else
              docker buildx use vpsbuilder
            fi
            docker buildx inspect --bootstrap >/dev/null

            echo "🧹 Down old containers (remove orphans)..."
            docker compose down --remove-orphans || true

            echo "🔨 Build backend (with persistent cache)..."
            docker buildx build \
              -f docker/backend.Dockerfile \
              -t app-backend:latest \
              --cache-from type=local,src=/opt/.buildx-cache/backend \
              --cache-to   type=local,dest=/opt/.buildx-cache/backend,mode=max \
              --load \
              .

            echo "🔨 Build frontend (with persistent cache)..."
            docker buildx build \
              -f docker/frontend.Dockerfile \
              -t app-frontend:latest \
              --cache-from type=local,src=/opt/.buildx-cache/frontend \
              --cache-to   type=local,dest=/opt/.buildx-cache/frontend,mode=max \
              --load \
              .

            echo "🚀 Starting containers (no rebuild)..."
            docker compose up -d --no-build

            echo "🧽 Optional: prune dangling images"
            docker image prune -f || true

            echo "✅ Done."
